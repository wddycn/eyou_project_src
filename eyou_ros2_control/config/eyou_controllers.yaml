controller_manager:
  ros__parameters:
    update_rate: 300  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # 新增：流式位置控制器
    joint_group_position_controller:
      type: forward_command_controller/ForwardCommandController

    load_on_start:
      - joint_state_broadcaster
      - joint_group_position_controller
      # ⚠️ 先不要自动加载新控制器（后面手动切换）
      # - joint_trajectory_controller


# ==============================
# 原有轨迹控制器（保留不动）
# ==============================
joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    action_monitor_rate: 300.0
    allow_partial_joints_goal: false

    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      joint_1: { trajectory: 0.0, goal: 0.1 }
      joint_2: { trajectory: 0.0, goal: 0.1 }
      joint_3: { trajectory: 0.0, goal: 0.1 }
      joint_4: { trajectory: 0.0, goal: 0.1 }
      joint_5: { trajectory: 0.0, goal: 0.1 }
      joint_6: { trajectory: 0.0, goal: 0.1 }


# ==============================
# ✅ 新增：流式控制器参数
# ==============================
joint_group_position_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

    interface_name: position